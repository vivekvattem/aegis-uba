project:
  name: aegis-ueba
  seed: 42
  output_dir: artifacts/default
  run_name: default

data:
  entities: 520
  days: 60
  events_per_entity_min: 100
  events_per_entity_max: 170
  anomaly_rate: 0.02
  entity_type_mix:
    user: 0.7
    service_account: 0.15
    edge_device: 0.15
  attack_type_weights:
    brute_force: 0.18
    impossible_travel: 0.15
    credential_stuffing: 0.14
    lateral_movement: 0.18
    device_spoofing: 0.15
    low_and_slow_exfiltration: 0.15
    insider_drift: 0.05
  sensitive_resource_ratio: 0.15
  campaigns_per_attack: 6
  data_subdir: default

features:
  rolling_windows_minutes: [5, 15, 60, 1440]
  velocity_kmh_threshold: 900.0
  sequence_length: 12
  min_history_for_entity_profile: 8
  peer_group_columns: ["entity_type", "role"]
  cold_start_holdout_fraction: 0.1

split:
  train: 0.6
  validation: 0.2
  test: 0.2

models:
  isolation_contamination: 0.02
  gru_hidden_dim: 32
  gru_num_layers: 1
  gru_dropout: 0.1
  gru_lr: 0.001
  gru_epochs: 6
  gru_batch_size: 64
  early_stopping_patience: 2
  classifier_max_depth: 10
  classifier_estimators: 200
  classifier_unknown_threshold: 0.45

risk:
  alert_budget_top_pct: 0.01
  threshold_percentile: 0.99
  safe_profile_update_threshold: 35
  weights:
    entity_deviation: 0.22
    peer_deviation: 0.12
    sequence_anomaly: 0.22
    contextual_evidence: 0.22
    auth_severity: 0.10
    resource_criticality: 0.06
    classifier_confidence: 0.06

drift:
  ewma_alpha: 0.15
  min_trusted_observations: 5

replay:
  micro_batch_size: 50
  sleep_seconds: 0.0
